<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>محاسبه BMI — ماشین حساب شاخص توده بدنی</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>محاسبه BMI</h1>
      <p class="subtitle">ماشین حساب شاخص توده بدنی</p>
      <p class="subtitle-en">Body Mass Index Calculator</p>
    </header>

    <main>
      <div class="card input-card">
        <h2>ورود اطلاعات</h2>
        <div class="form-group">
          <label for="weight">وزن (کیلوگرم) / Weight (kg)</label>
          <input type="number" id="weight" placeholder="مثلاً 70" min="1" step="0.1" dir="ltr">
        </div>
        <div class="form-group">
          <label for="height">قد (سانتی‌متر) / Height (cm)</label>
          <input type="number" id="height" placeholder="مثلاً 175" min="1" step="0.1" dir="ltr">
        </div>
        <button id="calculateBtn" class="btn-primary">محاسبه</button>
      </div>

      <div id="resultSection" class="card result-card" style="display: none;">
        <h2>نتیجه</h2>
        <div class="result-main">
          <div class="bmi-value">
            <span class="bmi-number" id="bmiNumber">—</span>
            <span class="bmi-label">شاخص توده بدنی</span>
          </div>
          <div class="bmi-persian" id="bmiPersian">—</div>
        </div>
        <div class="category" id="bmiCategory">—</div>
        <div class="details">
          <div class="detail-row">
            <span class="detail-label">وزن:</span>
            <span class="detail-value" id="weightDisplay">—</span>
          </div>
          <div class="detail-row">
            <span class="detail-label">قد:</span>
            <span class="detail-value" id="heightDisplay">—</span>
          </div>
        </div>
      </div>

      <div class="info-card">
        <h3>دسته‌بندی BMI</h3>
        <ul class="category-list">
          <li><span class="dot underweight"></span> کم‌وزنی (زیر ۱۸.۵)</li>
          <li><span class="dot normal"></span> نرمال (۱۸.۵ — ۲۴.۹)</li>
          <li><span class="dot overweight"></span> اضافه‌وزن (۲۵ — ۲۹.۹)</li>
          <li><span class="dot obese"></span> چاقی (۳۰ به بالا)</li>
        </ul>
      </div>
    </main>

    <footer>
      <p>ساخته شده با ❤️ | BMI Calculator</p>
    </footer>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
